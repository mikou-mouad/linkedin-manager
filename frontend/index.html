<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn Content Manager</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; background: #f6f7f9; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  input, button, textarea { font-family: inherit; font-size: 0.95rem; }
  .post-card { background: #fff; border: 1px solid #e2e2e2; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; gap: 16px; }
  .post-card img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; background: #eee; }
  .post-details { flex: 1; }
  .post-details textarea { width: 100%; min-height: 60px; margin-top: 6px; }
  .meta { display: flex; gap: 12px; font-size: 0.85rem; color: #555; margin-top: 6px; align-items: center; }
  .status { padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .status-draft { background: #eee; }
  .status-scheduled { background: #dbeafe; color: #1e40af; }
  .status-published { background: #dcfce7; color: #166534; }
  .status-failed { background: #fee2e2; color: #991b1b; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .actions button { padding: 6px 12px; border-radius: 6px; border: 1px solid #d0d0d0; background: #fff; cursor: pointer; }
  .actions button:hover:not(:disabled) { background: #f0f0f0; }
  .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  .error-msg { margin-top: 8px; font-size: 0.8rem; color: #991b1b; background: #fef2f2; padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Monthly LinkedIn Schedule</h1>
  <div class="toolbar">
    <input type="month" id="monthPicker">
    <button onclick="loadPosts()">Load</button>
    <button onclick="addPost()">+ New Post</button>
  </div>
  <div id="posts"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
