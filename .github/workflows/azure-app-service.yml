name: Build and deploy to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - '.github/workflows/azure-app-service.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  APP_SERVICE_NAME: 'linkedin-manager-cdf'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: src
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into server/public
        run: |
          rm -rf server/public
          mkdir -p server/public
          cp -r src/dist/* server/public/

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Zip server for deployment
        working-directory: server
        run: zip -r ../release.zip . -x "*.git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-service-release
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-service-release

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: release.zip
